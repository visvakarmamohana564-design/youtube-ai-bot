name: 📚 YouTube AI Auto-Upload Bot (MP Board Class 10th NCERT Educational Long Videos ONLY)

on:
  # =========================================================================
  # DAILY EDUCATIONAL LONG VIDEO SCHEDULE (IST = UTC + 5:30) — NO SHORTS!
  # =========================================================================
  schedule:
    # 1. Subah 7:30 AM IST — Morning Study Class 10 NCERT Chapter Long Video (02:00 UTC)
    - cron: '0 2 * * *'

    # 2. Shaam 6:30 PM IST — Evening Revision Class 10 NCERT Chapter Long Video (13:00 UTC)
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video Type (Locked to Educational Long Video 16:9)'
        required: true
        default: 'long'
        type: choice
        options:
          - long
      custom_topic:
        description: 'Optional MP Board Class 10 NCERT Chapter Name (Khali chhodne par Agla Chapter chalega)'
        required: false
        default: ''
        type: string
      voice_style:
        description: 'Optional Teacher Voice Style (male / female)'
        required: false
        default: 'male'
        type: choice
        options:
          - male
          - female
      privacy_status:
        description: 'Optional Upload Privacy (public / unlisted / private)'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      publish_at:
        description: 'Optional Schedule Time ISO UTC'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Cloud Server & Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies & Devanagari Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation pango1.0-tools
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp assets/NotoSansDevanagari-Bold.ttf ~/.local/share/fonts/ || true
          cp assets/NotoSansDevanagari-Bold.ttf ~/.fonts/ || true
          fc-cache -f || true
          pip install -q -r requirements.txt

      - name: 📚 Lock Format to Educational Long Video (16:9)
        id: decide
        run: |
          echo "vtype=long" >> $GITHUB_OUTPUT

      - name: "🧠 Step 2 - MP Board Class 10 NCERT Chapter Plan & Explanation Likhna"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: |
          python main.py --step script --type long --topic "${CUSTOM_TOPIC}"

      - name: "🎬 Step 3 - 1080p Smart-Board Chapter Reading & Explanation Render"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_STYLE_IN: ${{ github.event.inputs.voice_style }}
        run: |
          VVOICE="${VOICE_STYLE_IN:-male}"
          python main.py --step render --type long --voice "${VVOICE}"

      - name: "🚀 Step 4 - YouTube Channel Par Educational Long Video Upload (Category 27)"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY_IN: ${{ github.event.inputs.privacy_status }}
          PUBLISH_AT_IN: ${{ github.event.inputs.publish_at }}
        run: |
          VPRIV="${PRIVACY_IN:-public}"
          python main.py --step upload --type long --privacy "${VPRIV}" --publish-at "${PUBLISH_AT_IN}"

      - name: 💾 Save Covered Chapter History
        run: |
          if [ -f topic_history.json ]; then
            git config user.name "YouTube AI Bot"
            git config user.email "bot@users.noreply.github.com"
            git add topic_history.json
            git diff --staged --quiet || git commit -m "chore: update covered MP Board chapters history [skip ci]"
            git push
          fi
