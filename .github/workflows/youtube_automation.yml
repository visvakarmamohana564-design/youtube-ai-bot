name: 📚 YouTube AI Auto-Upload Bot (7:00 AM IST Class 10 NCERT Educational Long Videos)

on:
  # =========================================================================
  # DAILY 7:00 AM IST MORNING EDUCATIONAL LONG VIDEO UPLOAD (01:30 UTC = 7:00 AM IST)
  # =========================================================================
  schedule:
    - cron: '30 1 * * *'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video Type (Locked to Educational Long Video 16:9)'
        required: true
        default: 'long'
        type: choice
        options:
          - long
      custom_topic:
        description: 'Optional MP Board Class 10 NCERT Chapter Name (Khali chhodne par Scheduled Chapter upload hoga)'
        required: false
        default: ''
        type: string
      voice_style:
        description: 'Optional Teacher Voice Style (male / female)'
        required: false
        default: 'male'
        type: choice
        options:
          - male
          - female
      privacy_status:
        description: 'Optional Upload Privacy (public / unlisted / private)'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      publish_at:
        description: 'Optional Schedule Time ISO UTC'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Cloud Server & Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies & Devanagari Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation pango1.0-tools
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp assets/NotoSansDevanagari-Bold.ttf ~/.local/share/fonts/ || true
          cp assets/NotoSansDevanagari-Bold.ttf ~/.fonts/ || true
          fc-cache -f || true
          pip install -q -r requirements.txt

      - name: "🔬 Render & Auto-Upload Scheduled 7:00 AM IST Class 10 Chapter Video"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: |
          if [ -z "${CUSTOM_TOPIC}" ]; then
            python build_sci_ch1_master_video.py --upload
          else
            python main.py --step all --type long --topic "${CUSTOM_TOPIC}"
          fi
