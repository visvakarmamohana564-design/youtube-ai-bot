name: 🤖 YouTube AI Auto-Upload Bot (Shorts + Long Videos)

on:
  # =========================================================================
  # 4 DAILY INDIAN PRIME-TIME VIRAL SLOTS (IST = UTC + 5:30)
  # =========================================================================
  schedule:
    # 1. Subah 7:30 AM IST — Morning Viral Short (02:00 UTC)
    - cron: '0 2 * * *'

    # 2. Dopahar 1:30 PM IST — Midday Viral Short (08:00 UTC)
    - cron: '0 8 * * *'

    # 3. Shaam 6:30 PM IST — Peak Prime-Time Viral Short (13:00 UTC)
    - cron: '0 13 * * *'

    # 4. Raat 8:30 PM IST — Daily Night Animated Horror / Jaadui Kahani Long Video (15:00 UTC)
    - cron: '0 15 * * *'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video Type (shorts = Hindi Facts, long = Horror/Jaadui Kahani)'
        required: true
        default: 'shorts'
        type: choice
        options:
          - shorts
          - long
      custom_topic:
        description: 'Optional Custom Topic / Kahani (Khali chhodne par Default chalega)'
        required: false
        default: ''
        type: string
      voice_style:
        description: 'Optional Voice Style (male / female)'
        required: false
        default: 'male'
        type: choice
        options:
          - male
          - female
      privacy_status:
        description: 'Optional Upload Privacy (public / unlisted / private)'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      publish_at:
        description: 'Optional Schedule Time ISO UTC'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Cloud Server & Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation pango1.0-tools
          mkdir -p ~/.local/share/fonts
          cp assets/NotoSansDevanagari-Bold.ttf ~/.local/share/fonts/ || true
          fc-cache -f || true
          pip install -q -r requirements.txt

      - name: 🕒 Decide Video Type
        id: decide
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "vtype=${{ github.event.inputs.video_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" == "0 15 * * *" ]; then
            echo "vtype=long" >> $GITHUB_OUTPUT
          else
            echo "vtype=shorts" >> $GITHUB_OUTPUT
          fi

      - name: "🧠 Step 2 - AI Script, Title & Description Likhna"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
        run: |
          python main.py --step script --type "${{ steps.decide.outputs.vtype }}" --topic "${CUSTOM_TOPIC}"

      - name: "🎬 Step 3 - Hindi Voiceover, Visuals & Video Render"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_STYLE_IN: ${{ github.event.inputs.voice_style }}
        run: |
          VVOICE="${VOICE_STYLE_IN:-male}"
          python main.py --step render --type "${{ steps.decide.outputs.vtype }}" --voice "${VVOICE}"

      - name: "🚀 Step 4 - YouTube Channel Par Auto-Upload"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY_IN: ${{ github.event.inputs.privacy_status }}
          PUBLISH_AT_IN: ${{ github.event.inputs.publish_at }}
        run: |
          VPRIV="${PRIVACY_IN:-public}"
          python main.py --step upload --type "${{ steps.decide.outputs.vtype }}" --privacy "${VPRIV}" --publish-at "${PUBLISH_AT_IN}"

      - name: 💾 Save Topic History
        run: |
          if [ -f topic_history.json ]; then
            git config user.name "YouTube AI Bot"
            git config user.email "bot@users.noreply.github.com"
            git add topic_history.json
            git diff --staged --quiet || git commit -m "chore: update covered topics history [skip ci]"
            git push
          fi
